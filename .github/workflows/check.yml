name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # A2 用 git 历史比对示例题验算日期，浅克隆会误判
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund   # 按入库的 package-lock.json 安装，依赖版本与本地一致
      - run: npm run check
